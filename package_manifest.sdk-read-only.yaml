manifestVersion: 1

package:
  name: robonix.primitive.mirrorme.bpx.quadruped
  version: 0.1.0-dev.2
  description: Read-only MirrorMe BPX state provider with a Dockerized ROS 2 Humble runtime.
  tags: [primitive, quadruped, mirrorme, bpx, ros2, docker, read-only]
  maintainers:
    - nonkr <nonkr@hotmail.com>
  license: Apache-2.0

build: bash scripts/build.sh
start: bash scripts/start-sdk-read-only.sh
stop: bash scripts/stop.sh

# The SDK state adapter constructs RequestRobotState only. It has no command
# seam and therefore must not declare twist_in to Robonix.
capabilities:
  - name: robonix/primitive/quadruped/odom

depends: []
