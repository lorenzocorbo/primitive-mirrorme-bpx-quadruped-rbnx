manifestVersion: 1

package:
  name: robonix.primitive.mirrorme.bpx.quadruped
  version: 0.1.0-dev.2
  description: MirrorMe BPX odometry and guarded stand/sit posture provider with a Dockerized ROS 2 Humble runtime.
  tags: [primitive, quadruped, mirrorme, bpx, ros2, docker, odom, posture]
  maintainers:
    - nonkr <nonkr@hotmail.com>
  license: Apache-2.0

build: bash scripts/build.sh
start: bash scripts/start-sdk-posture.sh
stop: bash scripts/stop.sh

# The production SDK runtime owns one MotionLevelControl object for telemetry
# and exact stand/sit RPCs. Velocity mode stays disabled and twist is absent.
capabilities:
  - name: robonix/primitive/quadruped/odom
  - name: robonix/primitive/quadruped/posture

depends: []
